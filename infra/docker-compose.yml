# =============================================================================
# GenAI RCA — Module 1: Local Infrastructure
# =============================================================================
# Brings up OpenSearch for local development/testing. The live architecture
# reads directly from existing production OpenSearch indices (see
# services/mcp-server/project_config.py).
#
# Memory budget: ~2 GB (OpenSearch)
#
# Usage:
#   docker compose up -d
#   docker compose ps          # check health
#   docker compose down        # stop everything
#   docker compose down -v     # stop and DELETE all data
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # OPENSEARCH (single-node, security disabled for local dev/testing ONLY)
  # ---------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: poc-opensearch
    environment:
      - cluster.name=poc-cluster
      - node.name=poc-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # OPENSEARCH DASHBOARDS (http://localhost:5601)
  # ---------------------------------------------------------------------------
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    container_name: poc-osd
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
